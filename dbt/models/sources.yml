sources:
  - name: weathernext
    description: WeatherNext 3 via Analytics Hub, named by WEATHERNEXT_TABLE (project.dataset.table).
    database: "{{ env_var('WEATHERNEXT_TABLE').split('.')[0] }}"
    schema: "{{ env_var('WEATHERNEXT_TABLE').split('.')[1] }}"
    tables:
      - name: forecast_0p1deg
        identifier: "{{ env_var('WEATHERNEXT_TABLE').split('.')[2] }}"
        config:
          loaded_at_field: init_time
          freshness:
            # New runs arrive hourly.
            warn_after: {count: 3, period: hour}
            error_after: {count: 12, period: hour}
            # Keeps the freshness check to recent partitions instead of the whole table.
            filter: init_time > timestamp_sub(current_timestamp(), interval 1 day)
