sources:
  - name: weathernext
    description: WeatherNext 3 via Analytics Hub, named by WEATHERNEXT_TABLE (project.dataset.table).
    database: "{{ env_var('WEATHERNEXT_TABLE').split('.')[0] }}"
    schema: "{{ env_var('WEATHERNEXT_TABLE').split('.')[1] }}"
    tables:
      - name: forecast_0p1deg
        identifier: "{{ env_var('WEATHERNEXT_TABLE').split('.')[2] }}"
        config:
          loaded_at_field: init_time
          freshness:
            # New runs arrive hourly, but each one about 7 hours after it starts.
            warn_after: {count: 10, period: hour}
            error_after: {count: 24, period: hour}
            # Two days of partitions, longer than error_after, and within them
            # the Norway box, so the check reads a few MB instead of the globe.
            filter: >-
              init_time > timestamp_sub(current_timestamp(), interval 2 day)
              and st_intersects(geography, st_geogfromtext('{{ var("norway_box") }}', planar => true))
