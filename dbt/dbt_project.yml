name: weathernext_norway_wind
version: "0.1.0"
profile: weathernext_norway_wind

vars:
  # A box around mainland Norway; all of NVE's operating farms fall inside it.
  norway_box: "POLYGON((4 57.5, 32 57.5, 32 71.5, 4 71.5, 4 57.5))"
  # Only the runs at 00, 06, 12 and 18 UTC go past 48 hours, so the map's
  # forecast comes from the newest of those.
  max_hours: 72
  history_days: 5
  # No build reads further back than this: not the first build, and not the
  # catch-up after a pause, however long. The history then fills up to
  # history_days over the following days. To fill it sooner, run builds with
  # --vars '{backfill_days: 6}' until nothing is missing; each adds one UTC day.
  backfill_days: 1

models:
  weathernext_norway_wind:
    staging:
      +materialized: view
    exports:
      +materialized: table
      +contract:
        enforced: true

seeds:
  weathernext_norway_wind:
    nve_wind_farms:
      +column_types:
        id: int64
        lon: float64
        lat: float64
        capacity_mw: float64
        hub_height_m: float64
        turbines: int64
